<button
  type="button"
  (click)="onToggle()"
  (keydown)="onKeydown($event)"
  [attr.aria-sort]="ariaSort()"
  [class]="'inline-flex items-center gap-1.5 group select-none cursor-pointer focus:outline-none focus:ring-1 focus:ring-primary-500 rounded py-0.5 ' + 
    (align() === 'right' ? 'w-full justify-end' : align() === 'center' ? 'w-full justify-center' : 'w-full justify-start')">
  
  <span class="font-bold tracking-wider transition-colors"
    [class.text-primary-600]="isActive()"
    [class.dark:text-primary-400]="isActive()">
    <ng-content>{{ label() }}</ng-content>
  </span>

  <span class="inline-flex items-center text-xs transition-all flex-shrink-0"
    [class.text-primary-600]="isActive()"
    [class.dark:text-primary-400]="isActive()"
    [class.text-slate-400]="!isActive()"
    [class.group-hover:text-slate-600]="!isActive()">
    @if (isAsc()) {
      <svg class="w-3.5 h-3.5 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path>
      </svg>
    } @else if (isDesc()) {
      <svg class="w-3.5 h-3.5 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
      </svg>
    } @else {
      <svg class="w-3.5 h-3.5 opacity-40 group-hover:opacity-80 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
      </svg>
    }
  </span>
</button>
