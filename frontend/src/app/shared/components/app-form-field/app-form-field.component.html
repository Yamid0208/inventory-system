<div class="space-y-1.5 w-full">
  @if (label) {
    <div class="flex items-center justify-between">
      <label
        [attr.for]="forId"
        class="block text-xs font-semibold text-slate-700 tracking-wide"
      >
        {{ label }}
        @if (required) {
          <span class="text-rose-500 font-bold ml-0.5" aria-hidden="true">*</span>
          <span class="sr-only">(Requerido)</span>
        }
      </label>
      @if (hint && !error) {
        <span class="text-[11px] text-slate-400 font-normal">{{ hint }}</span>
      }
    </div>
  }

  <div class="relative">
    <ng-content></ng-content>
  </div>

  @if (error) {
    <p
      [id]="forId ? forId + '-error' : null"
      class="text-[11px] font-medium text-rose-600 flex items-center gap-1 mt-1 animate-fade-in"
      role="alert"
    >
      <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span>{{ error }}</span>
    </p>
  }
</div>
