<div
  class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm hover:shadow-md hover:border-slate-300 transition-all flex flex-col justify-between group"
>
  <!-- Top: Icon & Switch -->
  <div>
    <div class="flex items-center justify-between">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center transition-transform group-hover:scale-105" [ngClass]="getIconColorClass()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
      </div>

      <!-- Toggle Switch con estilo Stitch -->
      <button
        type="button"
        (click)="onToggle($event)"
        class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary-500/20"
        [class]="category.isActive ? 'bg-primary-600' : 'bg-slate-200'"
        [attr.aria-checked]="category.isActive"
        [title]="category.isActive ? 'Desactivar categoría' : 'Activar categoría'"
      >
        <span
          class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out flex items-center justify-center text-[10px]"
          [class]="category.isActive ? 'translate-x-5 text-primary-600' : 'translate-x-0 text-slate-400'"
        >
          @if (category.isActive) {
            <svg class="w-3 h-3 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
          }
        </span>
      </button>
    </div>

    <!-- Title & Description -->
    <h3 class="text-base font-bold text-slate-900 mt-4 tracking-tight group-hover:text-primary-700 transition-colors">
      {{ category.name }}
    </h3>
    <p class="text-xs text-slate-500 mt-1 leading-relaxed line-clamp-2 min-h-[32px]">
      {{ category.description || 'Sin descripción asignada para esta categoría.' }}
    </p>
  </div>

  <!-- Divider & Footer -->
  <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
    <div class="flex flex-col">
      <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Total Products</span>
      <div class="flex items-center gap-2">
        <span class="text-xl font-extrabold text-slate-900 tracking-tight">
          {{ category.productCount | number }}
        </span>
        @if ((category.totalStock ?? 0) > 0) {
          <span class="text-[10px] text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded-md font-semibold" title="Existencias físicas en inventario">
            {{ category.totalStock | number }} en stock
          </span>
        }
      </div>
    </div>

    <!-- Actions (Edit & Delete) -->
    <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
      <button
        type="button"
        (click)="edit.emit(category)"
        class="p-2 text-slate-400 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition-colors"
        title="Editar categoría"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
        </svg>
      </button>

      <button
        type="button"
        (click)="delete.emit(category)"
        class="p-2 rounded-lg transition-colors"
        [class]="category.productCount > 0
          ? 'text-amber-500 hover:text-amber-700 hover:bg-amber-50'
          : 'text-slate-400 hover:text-rose-600 hover:bg-rose-50'"
        [title]="category.productCount > 0
          ? 'Tiene ' + category.productCount + ' producto(s) asociado(s) - Restringido'
          : 'Eliminar categoría'"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
