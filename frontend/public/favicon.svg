<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="insincroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect width="32" height="32" rx="7" fill="url(#insincroGrad)" />
  <rect width="30" height="30" x="1" y="1" rx="6" fill="none" stroke="#27272A" stroke-width="1" />
  
  <!-- Stylized "I" and Synchronization Nodes -->
  <!-- Top sync node -->
  <circle cx="16" cy="7.5" r="2.5" fill="#FFFFFF" />
  
  <!-- Isometric / Synchronous flow lines forming an elegant "I" & sync cycle -->
  <path d="M16 11V21" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M10.5 13.5L16 10.5L21.5 13.5" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M21.5 18.5L16 21.5L10.5 18.5" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Bottom sync dot -->
  <circle cx="16" cy="24.5" r="2" fill="url(#accentGrad)" />
</svg>

